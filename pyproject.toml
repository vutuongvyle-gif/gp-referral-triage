[project]
name = "referral-triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vutuongvyle-gif", email = "vutuongvy.le@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==1.1.2",
    "arize-phoenix-otel==0.17.2",
    "chromadb==1.5.9",
    "deepeval==4.2.2",
    "en-core-web-lg",
    "en-core-web-md",
    "faker>=40.43.0",
    "httpx>=0.28.1",
    "langchain==1.2.15",
    "langchain-anthropic>=1.7.6",
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.1",
    "langchain-google-genai==4.4.2",
    "langchain-mcp-adapters==0.3.0",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.0",
    "langgraph==1.1.9",
    "langgraph-checkpoint-postgres==3.2.0",
    "mcp[cli]==1.30.0",
    "openinference-instrumentation-langchain==0.1.79",
    "pandas>=3.1.0",
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2",
    "pypdf==6.6.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "streamlit==1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
referral-triage = "referral_triage:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
